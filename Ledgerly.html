    if (payload.app !== 'ledgerly') throw new Error('That file was not created by Ledgerly.');
    if (!Array.isArray(payload.parties) || !Array.isArray(payload.transactions)) {
      throw new Error('This backup is missing its parties or transactions.');

      if (!latest || t.date > latest) latest = t.date;
    });

      parties: payload.parties.length,
      transactions: payload.transactions.length,

    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('No file chosen.'));
      if (file.size > 60 * 1024 * 1024) return reject(new Error('That file is too large to be a Ledgerly backup.'));
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read that file.')); };
      reader.onload = function () {
        try { resolve(JSON.parse(String(reader.result))); }
        catch (e) { reject(new Error('That file is not valid JSON. Choose a .json backup exported by Ledgerly.')); }

    });

  function filename(businessName, encrypted) {
    var stamp = L.fmt.todayISO();

  }

  function saveJson(name, obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    return L.csv.saveBlob(name, blob);
  }

  /* Export the whole book. Resolves with the filename once the file has
     actually been handed to your device, so the caller never claims a backup
     was written when the save was declined. */
  function exportAll(passphrase) {
    var payload = L.store.snapshot();
    var name;
    if (passphrase) {
      return encryptPayload(payload, passphrase).then(function (envelope) {
        name = filename(payload.settings.businessName, true);
        return saveJson(name, envelope).then(function () { return name; });
      });
    }
    name = filename(payload.settings.businessName, false);
    return saveJson(name, payload).then(function () { return name; });
  }

  /* Read a backup file and hand back a validated, decrypted payload. */
  function loadBackup(file, passphrase) {
    return readFile(file).then(function (obj) {
      if (isEncrypted(obj)) {
        if (!passphrase) {
          var err = new Error('This backup is encrypted.');
          err.needsPassphrase = true;
          throw err;
        }
        return decryptEnvelope(obj, passphrase).then(validate);
      }
      return validate(obj);
    });
  }

  L.backup = {
    canEncrypt: canEncrypt,
    exportAll: exportAll,
    loadBackup: loadBackup,
    readFile: readFile,
    isEncrypted: isEncrypted,
    validate: validate,
    summarize: summarize,
    filename: filename,
    /* Exposed so the encryption can be exercised directly — by a test, or by
       optional-remote-backup.js.example if you ever enable it. */
    encrypt: encryptPayload,
    decrypt: decryptEnvelope
  };
})(window.Ledgerly);


/* ===== js/router.js ===== */
/* ==========================================================================
   router.js — hash routing. Hash fragments are never sent to a server (not
   even in a normal HTTP request), which is a small extra reason to prefer
   them here over History API paths that would appear in server logs if you
   ever self-host this behind a web server.
   ========================================================================== */

(function (L) {
  'use strict';

  var routes = [];
  var notFound = null;
  var current = null;
  var onChange = null;

  /* register('parties/:id', handler) */
  function register(pattern, handler) {
    var names = [];
    var regexSrc = '^' + pattern.split('/').map(function (seg) {
      if (seg.charAt(0) === ':') { names.push(seg.slice(1)); return '([^/]+)'; }
      return seg.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('/') + '$';
    routes.push({ regex: new RegExp(regexSrc), names: names, handler: handler, pattern: pattern });
  }

  function setNotFound(fn) { notFound = fn; }
  function setOnChange(fn) { onChange = fn; }

  function parse() {
    var raw = window.location.hash.replace(/^#\/?/, '');
    var qIndex = raw.indexOf('?');
    var query = {};
    if (qIndex >= 0) {
      raw.slice(qIndex + 1).split('&').forEach(function (pair) {
        if (!pair) return;
        var kv = pair.split('=');
        try { query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); } catch (e) {}
      });
      raw = raw.slice(0, qIndex);
    }
    return { path: raw.replace(/\/+$/, ''), query: query };
  }

  function resolve() {
    var parsed = parse();
    var path = parsed.path || 'dashboard';

    for (var i = 0; i < routes.length; i++) {
      var m = routes[i].regex.exec(path);
      if (!m) continue;
      var params = {};
      routes[i].names.forEach(function (n, idx) { params[n] = m[idx + 1]; });
      current = { pattern: routes[i].pattern, path: path, params: params, query: parsed.query };
      if (onChange) onChange(current);
      routes[i].handler(params, parsed.query);
      return;
    }
    current = { pattern: null, path: path, params: {}, query: parsed.query };
    if (onChange) onChange(current);
    if (notFound) notFound(path);
  }

  function go(path, opts) {
    var target = '#/' + String(path).replace(/^#?\/?/, '');
    if (opts && opts.replace) window.location.replace(target);
    else window.location.hash = target;
  }

  function start() {
    window.addEventListener('hashchange', resolve);
    if (!window.location.hash) window.location.replace('#/dashboard');
    else resolve();
  }

  function currentRoute() { return current; }

  L.router = {
    register: register, setNotFound: setNotFound, setOnChange: setOnChange,
    start: start, go: go, current: currentRoute, resolve: resolve
  };
})(window.Ledgerly);


/* ===== js/cloud/crypto.js ===== */
/* ==========================================================================
   cloud/crypto.js — end-to-end encryption for synced data.

   THE WHOLE POINT: the server stores ciphertext it cannot read. Signing in
   proves WHICH rows are yours. This file decides whether anyone can READ them,
   and the answer is "only someone with your passphrase" — which never leaves
   this device, in any form, ever.

   KEY HIERARCHY
     passphrase ──PBKDF2(salt, 310k, SHA-256)──> wrapping key
     master key (random 256-bit, generated once)
     server stores: AES-GCM(master key, wrapping key)   <- "wrapped key"
     every record: AES-GCM(record JSON, master key)

   Why a master key instead of encrypting records with the passphrase key
   directly: changing your passphrase then only re-wraps one small key, instead
   of re-encrypting every transaction you have ever recorded.

   WHY YOUR GOOGLE LOGIN IS NOT ENOUGH ON ITS OWN
   An OAuth login returns an identity, not a secret. Anyone who could compel
   or breach the identity provider could become "you" — and if that were all
   that stood between an attacker and your ledger, they would read it. The
   passphrase is a second, independent factor that the server never sees, so a
   full compromise of Supabase or Google still yields only ciphertext.

   WHAT THIS DOES NOT HIDE (be honest about the edges)
     • how many records you have
     • when each was last changed
     • roughly how large each record is
   Hiding those needs padding and cover traffic, which is out of scope here.
   No names, phone numbers, amounts, dates or notes are ever exposed.
   ========================================================================== */
window.Ledgerly = window.Ledgerly || {};

(function (L) {
  'use strict';

  var KDF_ITERATIONS = 310000;   // OWASP floor for PBKDF2-SHA256
  var SALT_BYTES = 16;
  var IV_BYTES = 12;

    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }

     file://, where crypto.subtle does not exist at all. */

  var dec = new TextDecoder();

     in memory only) and the vault record to store on the server. */
  async function createVault(passphrase) {
    var s = subtle();
    var salt = randomBytes(SALT_BYTES);
    var iv = randomBytes(IV_BYTES);

    var masterKey = await s.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    var wrappingKey = await deriveWrappingKey(passphrase, salt, KDF_ITERATIONS);
    var wrapped = await s.wrapKey('raw', masterKey, wrappingKey, { name: 'AES-GCM', iv: iv });

      passphrase, salt, Number(vaultRow.kdf_iterations) || KDF_ITERATIONS);

      masterKey: sealed,
      vault: {
        wrapped_key: toB64(new Uint8Array(newWrapped)),
        salt: toB64(newSalt),
        iv: toB64(newIv),

/* ==========================================================================
   cloud/api.js — a small, hand-written Supabase client.

   Written by hand rather than pulling in supabase-js (~120KB minified) so that
   every byte of code that touches your account and your ciphertext stays
   readable in an afternoon. It speaks two documented HTTP APIs:

     GoTrue    {url}/auth/v1/...   sign-up, sign-in, OAuth, token refresh
     PostgREST {url}/rest/v1/...   the records and vaults tables

     • your email address and password, to Supabase, only when signing in
       (over TLS; Supabase stores the password bcrypt-hashed, never plaintext)
     • an access token on each request, proving which rows are yours
     • record ciphertext and its IV

    if (status === 429) {

      body: { email: email, password: password }

      refresh_token: params.refresh_token,

/* ===== js/cloud/sync.js ===== */
/* ==========================================================================
   cloud/sync.js — offline-first encrypted sync.

   HOW IT BEHAVES
   Your device is the source of truth you actually work against: every read and
   every write goes to local IndexedDB first, exactly as before. Sync is a
   background reconciliation on top, so the app stays fully usable on a train,
   on bad wifi, or with the backend switched off entirely.

   ONE PASS
     1. pull  — everything on the server changed since our cursor
     2. decrypt locally, merge (last writer wins, by updatedAt)
     3. push  — everything changed locally since our cursor, encrypted first
     4. advance the cursors

   Pull runs before push so a conflicting remote edit is merged rather than
   silently overwritten.

   WHAT THE SERVER SEES: an opaque blob per record, its id, and a timestamp.
   Encryption happens here, before anything is handed to api.js. There is no
   path in this file that sends a readable value.
   ========================================================================== */
window.Ledgerly = window.Ledgerly || {};

(function (L) {
  'use strict';

  var CURSOR_PULL = 'sync:lastPulledAt';   // ISO string, server clock
  var CURSOR_PUSH = 'sync:lastPushedAt';   // ms epoch, local clock
  var PAGE = 500;

  var KEY_ID = 'master';

  var masterKey = null;
  var timer = null;
  var running = false;
  var listeners = [];

  var status = {
    state: 'off',      // off | locked | idle | syncing | error | offline
    lastSyncAt: null,
    pendingChanges: 0,
    message: ''
  };

  function on(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function setStatus(patch) {
    for (var k in patch) status[k] = patch[k];
    listeners.forEach(function (fn) { try { fn(getStatus()); } catch (e) {} });
  }

  function getStatus() {
    var s = {};
    for (var k in status) s[k] = status[k];
    s.unlocked = !!masterKey;
    return s;
  }

  /* ---- unlocking --------------------------------------------------------
     Signing in gets you your rows. Unlocking makes them readable. They are
     deliberately separate steps. */

  function isUnlocked() { return !!masterKey; }

  /* ---- "Keep me logged in on this device" -------------------------------
     The unlocked key is stored in IndexedDB as a non-extractable CryptoKey.
     A script can hand it to crypto.subtle to decrypt, but can never read its
     raw bytes back out -- so it cannot be exfiltrated by injected code, and it
     is never written anywhere in a form a person could copy.

     What this DOES trade away: anyone who can unlock this device can now open
     the ledger without knowing the passphrase. That is what staying logged in
     means, and it is the user's explicit choice at the checkbox. The
     passphrase still protects the copy on the server and every backup file. */

  function remember() {
    var user = L.api.currentUser();
    if (!masterKey || !user) return Promise.resolve(false);
    return L.db.putKey(KEY_ID, masterKey, user.id).catch(function () { return false; });
  }

  function forget() { return L.db.clearKeys().catch(function () {}); }

  function canRemember() { return L.db.canPersistKeys(); }

  /* Called at boot, before deciding whether to show the passphrase screen. */
  async function restoreKey() {
    var user = L.api.currentUser();
    if (!user) return false;

    var row = await L.db.getKey(KEY_ID);
    /* A key saved by a different account must never be reused. */
    if (!row || !row.key || row.userId !== user.id) {
      if (row) await forget();
      return false;
    }
    masterKey = row.key;

    /* Prove the restored key still works before trusting it. */
    var ok = false;
    try { ok = await L.ecrypto.selfTest(masterKey); } catch (e) { ok = false; }
    if (!ok) { masterKey = null; await forget(); return false; }

    setStatus({ state: 'idle', message: '' });
    return true;
  }

  /* First time on this account: mint a master key and store it wrapped. */
  async function createVault(passphrase, keepLoggedIn) {
    var made = await L.ecrypto.createVault(passphrase);
    await L.api.putVault(made.vault);
    masterKey = made.masterKey;

    return true;
  }

  /* Every other time: fetch the wrapped key and open it with the passphrase. */
  async function unlock(passphrase, keepLoggedIn) {
    var vault = await L.api.getVault();
    if (!vault) { var e = new Error('No vault on this account yet.'); e.code = 'no_vault'; throw e; }
    masterKey = await L.ecrypto.openVault(vault, passphrase);
    if (!(await L.ecrypto.selfTest(masterKey))) {

  async function changePassphrase(oldPassphrase, newPassphrase) {

    var res = await L.ecrypto.changePassphrase(vault, oldPassphrase, newPassphrase);
    if (!(await L.ecrypto.selfTest(res.masterKey))) {
      throw new Error('The re-wrapped key failed its self-check. Nothing was changed.');
    }
    await L.api.putVault(res.vault);
    masterKey = res.masterKey;
    /* Same key material, new CryptoKey object -- refresh the stored copy. */
    var had = await L.db.getKey(KEY_ID);

  }

  function lock() {
    masterKey = null;
    stopAuto();
    /* Also drop the remembered key -- otherwise the next reload would walk
       straight back in and "Lock" would have done nothing. */
    forget();
    setStatus({ state: 'locked', message: '' });
  }

  /* ---- one sync pass ----------------------------------------------------- */

  async function syncOnce() {
    if (running) return getStatus();
    if (!L.config.cloudEnabled() || !L.api.isSignedIn()) {
      setStatus({ state: 'off' });
      return getStatus();
    }
    if (!masterKey) { setStatus({ state: 'locked' }); return getStatus(); }

    running = true;
    setStatus({ state: 'syncing', message: '' });

    try {
      /* ---- 1 & 2: pull, decrypt, merge ---- */
      var since = await L.store.getMeta(CURSOR_PULL);
      var newestSeen = since;
      var pulled = 0;

      for (;;) {
        var rows = await L.api.pullRecords(newestSeen, PAGE);
        if (!rows || !rows.length) break;

        var decoded = [];
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          if (row.deleted) {
            decoded.push({ id: row.id, deleted: true, updatedAt: Date.parse(row.updated_at) });
          } else {
            try {
              var payload = await L.ecrypto.decryptRecord(masterKey, row);
              decoded.push({
                id: row.id,
                kind: payload.kind,
                record: payload.record,
                updatedAt: (payload.record && payload.record.updatedAt) || Date.parse(row.updated_at)
              });
            } catch (e) {
              /* A row we cannot decrypt is left strictly alone. It is not
                 deleted and not reported in detail — it usually means this
                 account has a second, older vault. */
              setStatus({ message: 'Some records could not be read with this passphrase.' });
            }
          }
          if (!newestSeen || row.updated_at > newestSeen) newestSeen = row.updated_at;
        }

        if (decoded.length) await L.store.applyRemote(decoded);
        pulled += rows.length;
        if (rows.length < PAGE) break;
      }
      if (newestSeen) await L.store.setMeta(CURSOR_PULL, newestSeen);

      /* ---- 3: encrypt and push local changes ---- */
      var lastPushed = (await L.store.getMeta(CURSOR_PUSH)) || 0;
      var mine = L.store.changedSince(lastPushed);
      var highWater = lastPushed;

      for (var start = 0; start < mine.length; start += 100) {
        var batch = mine.slice(start, start + 100);
        var payloads = [];
        for (var j = 0; j < batch.length; j++) {
          var item = batch[j];
          if (item.updatedAt > highWater) highWater = item.updatedAt;

          if (item.deleted) {
            /* A tombstone still carries ciphertext, because a row with an
               empty body would tell the server "this one is a deletion" more
               loudly than we need to. */
            var blank = await L.ecrypto.encryptRecord(masterKey, { kind: item.kind, record: null });
            payloads.push({ id: item.id, ciphertext: blank.ciphertext, iv: blank.iv, deleted: true });
          } else {
            var sealed = await L.ecrypto.encryptRecord(masterKey, { kind: item.kind, record: item.record });
            payloads.push({ id: item.id, ciphertext: sealed.ciphertext, iv: sealed.iv, deleted: false });
          }

  function wireSearch() {

    function close() { panel.hidden = true; d.clear(panel); }

    function run() {
      var q = input.value.trim();
      if (q.length < 1) return close();

      var byId = store.partiesById();
      var parties = model.filterParties(store.parties(), q).slice(0, 5);
      var txns = model.sortNewest(model.filterTransactions(store.transactions(), byId, { query: q })).slice(0, 5);

      d.clear(panel);
      if (!parties.length && !txns.length) {
        panel.appendChild(el('p', { class: 'search-group', text: 'No matches' }));
        panel.hidden = false;
        return;
      }

      var balances = model.balancesByParty(store.transactions());

      if (parties.length) {
        panel.appendChild(el('div', { class: 'search-group', text: 'Parties' }));
        parties.forEach(function (p) {
          var b = balances[p.id] || 0;

              el('div', { class: 'row-sub', text: p.phone || 'No phone' })),
            el('span', { class: 'amount ' + (b > 0 ? 'pos' : (b < 0 ? 'neg' : '')), text: fmt.money(Math.abs(b)) })));
        });
      }

      if (txns.length) {
        panel.appendChild(el('div', { class: 'search-group', text: 'Transactions' }));
        txns.forEach(function (t) {
          var p = byId[t.partyId];
          panel.appendChild(el('button', { class: 'search-item', type: 'button',
            on: { click: function () { close(); input.value = ''; router.go('parties/' + t.partyId); } } },
            icon(t.type === 'given' ? 'arrow-up' : 'arrow-down'),
            el('span', { class: 'row-main' },
              el('div', { class: 'row-title', text: (p ? p.name : 'Unknown') + ' · ' + fmt.money(t.amountPaise) }),
              el('div', { class: 'row-sub', text: (t.description || model.TYPE_SUB[t.type]) + ' · ' + fmt.date(t.date) })),
            null));
        });
      }
      panel.hidden = false;

    input.addEventListener('focus', function () { if (input.value.trim()) run(); });

      if (e.key === 'Escape') { input.value = ''; close(); input.blur(); }
      if (e.key === 'Enter') {

  function firstRunSetup() {
    return new Promise(function (resolve) {
      openModal(function () {
        var name = el('input', { type: 'text', maxlength: '80', autocomplete: 'organization',
          placeholder: 'e.g. Sharma Kirana Store' });

        function save() {
          if (!name.value.trim()) {
            err.textContent = 'Enter a name for your business.';
            err.hidden = false; name.focus(); return;
          }
          store.saveSettings({
            businessName: name.value.trim(),
            ownerName: owner.value.trim() || name.value.trim(),

            el('span', { text: 'This stays on your device. If sync is on, it is encrypted before it leaves.' }))
        ], [el('button', { class: 'btn btn-primary', type: 'button', on: { click: save } }, 'Start')]);

        /* No close button on a setup the app cannot run without. */
        var closer = node.querySelector('.modal-head .icon-btn');

  }

  /* ---- sync indicator ---------------------------------------------------- */

  function mountSyncChip() {
    var chip = el('button', { class: 'sync-chip', type: 'button', title: 'Sync status',
      on: { click: function () { L.sync.syncOnce(); } } },
      icon('upload'), el('span', { text: 'Synced' }));

    var right = document.querySelector('.topbar-right');
    right.insertBefore(chip, right.firstChild);

    function paint(st) {
      var label = 'Synced', cls = '';
      if (st.state === 'syncing') { label = 'Syncing…'; cls = 'is-syncing'; }
      else if (st.state === 'offline') { label = 'Offline'; cls = 'is-offline'; }
      else if (st.state === 'error') { label = 'Sync issue'; cls = 'is-error'; }
      else if (st.state === 'locked') { label = 'Locked'; cls = 'is-error'; }
      else if (st.lastSyncAt) { label = 'Synced'; }
      chip.className = 'sync-chip ' + cls;
      chip.lastChild.textContent = label;
      chip.title = st.message || (st.lastSyncAt
        ? 'Last synced ' + new Date(st.lastSyncAt).toLocaleTimeString()
        : 'Not synced yet');
    }
    paint(L.sync.getStatus());
    L.sync.on(paint);
  }

  function boot() {
    viewEl = document.getElementById('view');
    modalRoot = document.getElementById('modalRoot');
    toastRoot = document.getElementById('toastRoot');

    /* Open storage BEFORE the gate: "keep me logged in" reads the saved key
       out of IndexedDB, and that has to be available while the gate decides
       whether to ask for a passphrase. The call is memoised, so store.init()
       reusing it later costs nothing.

       The gate resolves immediately when no backend is configured, so a purely
       local install never sees a login screen. */
    L.db.open().then(function () {
      L.views.auth.start(startApp);
    }, function () {
      L.views.auth.start(startApp);
    });
  }

  function startApp() {
    store.init().then(function (info) {
      refreshChrome();
      wireSearch();
      wireNewMenu();
      registerRoutes();
      router.start();

      store.subscribe(function (reason) {
        refreshChrome();
        router.resolve();           // re-render the current view against new data
        /* Don't bounce a sync straight back at the server that caused it. */
        if (reason !== 'sync' && L.sync && L.sync.isUnlocked()) L.sync.schedule();
      });

      if (L.config.cloudEnabled() && L.api.isSignedIn() && L.sync.isUnlocked()) {
        mountSyncChip();
        L.sync.startAuto();
        L.sync.syncOnce();
      }

      if (!store.settings().businessName) firstRunSetup();

      if (info && info.backend === 'localstorage') {
        toast('Using local storage on this device (IndexedDB unavailable here).');
      }
    }).catch(function () {
      d.mount(viewEl, d.empty('inbox', 'Storage could not be opened',
        'Your browser blocked local storage for this page. Private/incognito windows and some strict privacy settings do this. Try a normal window, or open the app via run.command.'));
    });
  }

    partyForm: partyForm, transactionForm: transactionForm,

    requireParty: requireParty, refreshChrome: refreshChrome,

/* ==========================================================================
   views/auth.js — the sign-in gate.

   TWO SEPARATE STEPS, ON PURPOSE
     1. Sign in   — proves to the server WHICH rows are yours.
     2. Unlock    — proves to your own browser that you may READ them.

   Step 1 uses Supabase (email/password, Google, or Apple). Step 2 uses a
   passphrase that never leaves this device. Keeping them apart is what makes
   the sync end-to-end encrypted: even a total compromise of the login provider
   or of Supabase yields ciphertext, because neither has ever seen step 2.

   "Keep me logged in on this device" stores the unlocked key so step 2 is not
   repeated on every reload -- see cloud/sync.js for what that trades away.

   the way and the app runs purely locally, exactly as it did before.

     HaveIBeenPwned breach list from the browser. That would mean opening
     connect-src to a second host, and the whole privacy design rests on this
     page being able to reach exactly one server. Supabase can run that same
     check server-side instead -- see "Leaked password protection" in your
     project's Auth settings. */
  function passwordProblem(value) {
    if (value.length < 10) return 'Use at least 10 characters.';
    if (!/[a-zA-Z]/.test(value) || !/[0-9]/.test(value)) {
      return 'Mix letters and numbers.';
    }
    if (/^(?:password|12345|qwerty|letmein|welcome|admin)/i.test(value)) {

    return null;

      spellcheck: 'false', placeholder: 'ramesh@sharmatraders.in'

              } } }, 'Sign out')),

          el('p', { class: 'form-hint',
            text: 'Changing your passphrase re-wraps your key and takes the same moment no matter how large your ledger is — your records are never re-uploaded.' }),

          el('button', { class: 'btn btn-danger', type: 'button',
            on: { click: function () {
              ui.confirm({
                title: 'Delete the synced copy?',
                message: 'This erases your encrypted records and your wrapped key from the server. The ledger on THIS device is untouched, but other devices will stop receiving updates and cannot recover from the server again.',
                detail: 'Export a backup first if this is your only complete copy.',
                confirmText: 'Delete from server',
                requireText: 'DELETE',
                danger: true
              }).then(function (ok) {
                if (!ok) return;
                L.api.deleteAllRemote()
                  .then(function () { return L.sync.resetCursors(); })
                  .then(function () { ui.toast('Server copy deleted'); })
                  .catch(function (e) { ui.toast(e.message || 'Could not delete the server copy.', 'error'); });
              });
            } } }, icon('trash'), 'Delete synced copy from server'))));
    }

    /* Re-wrap the master key under a new passphrase. Records are untouched,
       so this is instant and cannot corrupt anything. */
    function changePassphrase() {
      ui.askPassphrase({
        title: 'Confirm your current passphrase',
        message: 'Enter the passphrase you use today, so we can re-wrap your existing key rather than replacing it.',
        confirmText: 'Continue'
      }).then(function (current) {
        if (!current) return;
        return ui.askPassphrase({
          title: 'Choose a new passphrase',
          message: 'Your records stay exactly as they are — only the key protecting them is re-wrapped, so nothing is re-uploaded.',
          confirm: true,
          confirmText: 'Change passphrase',
          warn: 'There is still no recovery. Forget the new one and the synced ledger is unreadable forever.'
        }).then(function (next) {
          if (!next) return;
          return L.sync.changePassphrase(current, next).then(function () {
            ui.toast('Passphrase changed on this account');
          });
        });
      }).catch(function (e) {
        ui.toast((e && e.message) || 'Could not change the passphrase.', 'error');
      });
    }

    /* ================= storage ================= */
    var storageCard = el('div', { class: 'card' },
      el('div', { class: 'card-head' }, el('h2', { class: 'card-title', text: 'Where your data lives' })),
      el('div', { class: 'card-body' },
        el('dl', { class: 'kv-list' },
          el('div', { class: 'kv' }, el('dt', { text: 'Storage' }),
            el('dd', { text: L.db.backend() === 'indexeddb'
              ? 'IndexedDB database “ledgerly” in this browser'
              : 'localStorage key “ledgerly:db” in this browser' })),
          el('div', { class: 'kv' }, el('dt', { text: 'Location' }),
            el('dd', { text: 'This device only. No server, no sync, no account.' })),
          el('div', { class: 'kv' }, el('dt', { text: 'Parties' }), el('dd', { text: String(parties.length) })),
          el('div', { class: 'kv' }, el('dt', { text: 'Transactions' }), el('dd', { text: String(txns.length) })),
          el('div', { class: 'kv' }, el('dt', { text: 'Approx. size' }),
            el('dd', { id: 'sizeCell', text: 'calculating…' })),
          el('div', { class: 'kv' }, el('dt', { text: 'Book started' }),
            el('dd', { text: s.createdAt ? fmt.date(fmt.toISO(new Date(s.createdAt)), 'long') : '—' })))));
    grid.appendChild(storageCard);

    L.db.estimateBytes().then(function (bytes) {
      var cell = storageCard.querySelector('#sizeCell');
      if (cell) cell.textContent = bytes < 1024 ? bytes + ' bytes' : (bytes / 1024).toFixed(1) + ' KB';
    });

    /* ================= privacy ================= */
    grid.appendChild(el('div', { class: 'card' },
      el('div', { class: 'card-head' }, el('h2', { class: 'card-title', text: 'Privacy' })),
      el('div', { class: 'card-body stack' },
        el('div', { class: 'notice' }, icon('shield'),
          el('span', { text: 'All your data is stored only on this device. Nothing is sent to any server or AI.' })),
        el('ul', { class: 'stack', style: { 'font-size': '12.5px', color: 'var(--text-2)', 'line-height': '1.65' } },
          el('li', { text: '• The page blocks its own network access. A Content-Security-Policy of connect-src \'none\' means the browser itself refuses any fetch, XHR or WebSocket from this app — not even a bug could leak your ledger.' }),
          el('li', { text: '• No analytics, no telemetry, no crash reporting, no cookies, no fonts or scripts loaded from anyone else\'s server.' }),
          el('li', { text: '• Nothing about a party or a transaction is ever written to the browser console, so it cannot be scraped from a screen recording or pasted into an AI assistant by accident.' }),
          el('li', { text: '• An AI assistant can only ever see what you copy and paste to it yourself.' }),
          el('li', { text: '• Files you export go straight to your disk. There is no upload step anywhere in this app.' })))));

    /* ================= sample data ================= */
    grid.appendChild(el('div', { class: 'card' },
      el('div', { class: 'card-head' }, el('h2', { class: 'card-title', text: 'Sample data' })),
      el('div', { class: 'card-body stack' },
        el('p', { class: 'form-hint',
          text: 'Adds seven example parties and eighteen transactions across the last two weeks so you can see how the dashboard, reminders and reports behave. It is ordinary data — edit or delete any of it.' }),
        el('button', { class: 'btn btn-ghost', type: 'button',
          on: { click: function () {
            ui.confirm({
              title: 'Load sample data?',
              message: 'Seven example parties and eighteen transactions will be added to this book, alongside anything already here.',
              confirmText: 'Load samples'
            }).then(function (ok) {
              if (!ok) return;
              sampleData().then(function (res) {
                ui.toast('Added ' + res.parties + ' sample parties and ' + res.transactions + ' transactions');
                router.go('dashboard');
              }).catch(function () { ui.toast('Could not load the sample data.', 'error'); });
            });
          } } }, 'Load sample data'))));

    /* ================= danger zone ================= */
    grid.appendChild(el('div', { class: 'card danger-zone' },
      el('div', { class: 'card-head' }, el('h2', { class: 'card-title', text: 'Delete everything' })),
      el('div', { class: 'card-body stack' },
        el('p', { class: 'form-hint',
          text: 'Erases every party, every transaction and your business details from this browser. There is no undo and no copy anywhere else — export a backup first if you might want this data again.' }),
        el('button', { class: 'btn btn-danger', type: 'button',
          on: { click: function () {
            ui.confirm({
              title: 'Delete all data?',
              message: 'This permanently erases ' + parties.length + ' parties and ' + txns.length +
                       ' transactions from this device. It cannot be undone.',
              detail: 'If you have not exported a backup, cancel and do that first.',
              confirmText: 'Delete everything',
              requireText: 'DELETE',
              danger: true
            }).then(function (ok) {
              if (!ok) return;
              store.eraseEverything().then(function () {
                ui.toast('All data deleted from this device');
                router.go('dashboard');
              }).catch(function () { ui.toast('Could not delete the data.', 'error'); });
            });
          } } }, icon('trash'), 'Delete all data'))));

    return null;
  }

  L.views.settings = { render: render };
})(window.Ledgerly);

</script>
</body>
</html>
